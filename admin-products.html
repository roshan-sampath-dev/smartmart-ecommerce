<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage Products page for SmartMart online shopping demo.">
  <title>Manage Products | SmartMart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="navbar">
    <a href="index.html" class="logo">SmartMart</a>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="categories.html">Categories</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <form class="search-form" action="products.html" method="get" role="search">
      <label class="visually-hidden" for="searchInput">Search products</label>
      <input type="search" id="searchInput" name="q" placeholder="Search products...">
      <button type="submit" id="searchBtn">Search</button>
    </form>
    <a href="wishlist.html" class="wishlist-link">Wishlist</a>
    <a href="cart.html" class="cart-link">Cart (<span id="cartCount">0</span>)</a>
    <a href="login.html" class="account-link">Login</a>
  </div>
</header>
<main class="container">
<section class="page-intro"><h1>Manage Products</h1><p>Add, edit and review demo products.</p></section>
<section class="admin-content"><form id="productForm"><h2>Product Details</h2><label for="adminProductName">Product name</label><input id="adminProductName" required><label for="adminProductCategory">Category</label><select id="adminProductCategory" required><option value="">Select category</option><option value="electronics">Electronics</option><option value="clothing">Clothing</option><option value="groceries">Groceries</option><option value="home-kitchen">Home &amp; Kitchen</option></select><label for="adminProductPrice">Price (LKR)</label><input id="adminProductPrice" type="number" min="0" step="0.01" required><label for="adminProductStock">Stock quantity</label><input id="adminProductStock" type="number" min="0" step="1" required><button type="submit">Save Product</button></form><h2>Product List</h2><div id="adminProductList">No products loaded.</div></section>
</main>
<footer class="site-footer">
  <p>&copy; 2026 SmartMart. Educational project for ITE 1713 – Web Design.</p>
  <nav aria-label="Footer navigation">
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="admin-dashboard.html">Demo Admin</a>
  </nav>
</footer>
<script src="js/app.js" defer></script>
</body>
</html>
